version: "3.8"

services:

  db:
    image: postgres:16
    container_name: leads-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leads_db

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/data/leads_seed.sql:/docker-entrypoint-initdb.d/leads_seed.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    container_name: leads-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    # Load environment variables from /submission/.env
    env_file:
      - ./.env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/leads_db

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - ./frontend:/frontend

volumes:
  pgdata: